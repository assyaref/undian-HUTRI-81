<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pendaftaran — Spin Wheel Hadiah</title>
    <meta name="description" content="Pendaftaran peserta Undian HUT RI ke-81." />
    <meta name="robots" content="index, follow" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="cache-control" content="no-cache" />
    <base href="/">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      *{box-sizing:border-box}
      body{margin:0;background:hsl(36 53% 94%);color:hsl(246 31% 16%);font-family:"Space Grotesk",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
      a{color:inherit;text-decoration:none}
      .topbar{display:flex;justify-content:space-between;align-items:center;height:78px;padding:0 clamp(20px,5vw,72px);background:#27234af5;color:#f6ecd8}
      .brand{display:flex;align-items:center;gap:12px}
      .brand-mark{width:38px;height:38px;display:grid;place-items:center;background:#f38b63;color:#29244a;border-radius:12px 12px 12px 4px;transform:rotate(-7deg);box-shadow:4px 4px #7970ce;font-weight:700}
      .brand-name{font-size:17px;font-weight:700;letter-spacing:-.04em}
      .brand-sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#c7bee9}
      .registration-page{max-width:760px;margin:0 auto;padding:clamp(44px,6vw,58px) clamp(24px,6vw,72px) 72px}
      .registration-eyebrow{font-family:"DM Mono",monospace;color:#7167bd;text-transform:uppercase;letter-spacing:.12em;font-size:11px;margin:0 0 10px}
      .registration-title{font-family:"Fraunces",serif;letter-spacing:-.03em;margin:0;font-size:clamp(26px,4vw,40px);line-height:1.08}
      .registration-copy{color:hsl(246 12% 43%);margin:14px 0 24px;font-size:14px}
      .registration-card{background:#fff;border:1px solid hsl(37 25% 80%);border-radius:26px;padding:clamp(22px,3vw,36px);box-shadow:0 18px 55px #3d2f5b14}
      .registration-field{margin-bottom:16px}
      .registration-field label{display:block;margin:0 0 6px;font-size:13px;font-weight:600}
      .registration-field input{width:100%;padding:13px 14px;border:1px solid hsl(37 25% 80%);border-radius:14px;background:#fff;font:inherit;color:inherit}
      .register-button{background:hsl(258 79% 59%);color:#fff;border:none;border-radius:999px;padding:15px 28px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
      .success-mark{width:46px;height:46px;border-radius:50%;background:hsl(161 54% 46%);color:#fff;display:grid;place-items:center;font-size:22px;margin:0 auto}
      .success-title{margin:0;font-size:19px;letter-spacing:-.02em}
      .success-code{font-family:"DM Mono",monospace;font-size:22px;color:#16705a;margin:8px 0}
      .success-detail{color:hsl(246 12% 43%);font-size:13px;margin:0}
      .succ-button{background:hsl(258 79% 59%);color:#fff;border:none;border-radius:999px;padding:12px 24px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:18px}
      .back-link{display:inline-flex;align-items:center;gap:6px;margin:28px 0 0;color:hsl(246 12% 43%);font-size:13px}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        "use strict";
        function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
        function readEntries() { try { var r = localStorage.getItem("hadiah-entries"); return r ? JSON.parse(r) || [] : []; } catch (e) { return []; } }
        window.__curCode = "";
        window.copyCode = function () { if (window.__curCode) { try { navigator.clipboard.writeText(window.__curCode); } catch (e) {} } };
        window.__reg = function (ev) {
          ev.preventDefault();
          var name = document.getElementById("regName");
          var dept = document.getElementById("regDept");
          var res = document.getElementById("regResult");
          if (!name || !dept || !res) return false;
          
          var nm = name.value.trim(), dp = dept.value.trim();
          if (!nm || !dp) {
            alert("Mohon isi semua field dengan lengkap!");
            return false;
          }
          
          // Generate kode unik yang lebih aman
          var timestamp = Date.now();
          var randomStr = Math.random().toString(36).slice(2, 8).toUpperCase();
          var code = "#HUT81-" + randomStr;
          
          try {
            var entries = readEntries();
            // Simpan data lengkap untuk keperluan audit
            entries.push({ 
              id: timestamp + "-" + Math.random().toString(36).slice(2, 7), 
              code: code,
              name: code, // Tampilkan kode di wheel spin
              fullName: nm, 
              department: dp,
              registeredAt: new Date().toISOString()
            });
            localStorage.setItem("hadiah-entries", JSON.stringify(entries));
            window.__curCode = code;
            
            // Reset form
            name.value = "";
            dept.value = "";
            
            // Tampilkan pesan sukses dengan tombol kembali ke wheel
            res.innerHTML = '<div class="registration-card" style="text-align:center"><span class="success-mark">\u2713</span><h2 class="success-title">Pendaftaran berhasil!</h2><p class="success-detail">Kode unik lucky draw kamu:</p><p class="success-code">' + esc(code) + '</p><p class="success-detail">' + esc(nm) + ' &middot; ' + esc(dp) + '</p><p style="margin-top:12px;font-size:12px;color:#16705a;">✅ Kode berhasil ditambahkan ke daftar undian!</p><div style="display:flex;gap:12px;justify-content:center;margin-top:18px;"><button class="succ-button" type="button" onclick="window.copyCode()" style="background:hsl(37 25% 92%);color:hsl(246 12% 43%);">Salin kode</button><a href="/" class="succ-button" style="text-decoration:none;display:inline-block;">Buka Spin Wheel</a></div></div>';
          } catch (e) {
            res.innerHTML = '<div class="registration-card" style="text-align:center"><span class="success-mark" style="background:#ef6657;">!</span><h2 class="success-title">Terjadi kesalahan</h2><p class="success-detail">Mohon coba lagi nanti.</p><a href="/" class="succ-button" style="text-decoration:none;display:inline-block;margin-top:18px;">Kembali</a></div>';
          }
          return false;
        };
        var root = document.getElementById("root");
        root.innerHTML =
          '<header class="topbar"><a class="brand" href="/"><span class="brand-mark">H</span><div><div class="brand-name">Spin Wheel Hadiah</div><div class="brand-sub">make a moment of it</div></div></a></header>' +
          '<main class="registration-page">' +
            '<p class="registration-eyebrow">Form pendaftaran</p>' +
            '<h1 class="registration-title">Peserta Undian HUT RI ke-81 x Radiant Group</h1>' +
            '<p class="registration-copy">Daftarkan diri untuk mendapatkan kode unik lucky draw. <span style="color:#16705a;font-weight:600;">Total peserta terdaftar: ' + readEntries().length + '</span></p>' +
            '<div class="registration-card"><form onsubmit="return window.__reg(event)">' +
              '<div class="registration-field"><label for="regName">Nama lengkap</label><input id="regName" maxlength="60" required placeholder="Contoh: Putri Anggraini"></div>' +
              '<div class="registration-field"><label for="regDept">Departemen</label><input id="regDept" maxlength="60" required placeholder="Contoh: Human Resources"></div>' +
              '<button class="register-button" type="submit">Daftar &amp; Dapatkan kode</button>' +
            '</form></div><div id="regResult"></div><a class="back-link" href="/">\u2190 Back to the spin wheel</a>' +
          "</main>";
      })();
    </script>
  </body>
</html>
